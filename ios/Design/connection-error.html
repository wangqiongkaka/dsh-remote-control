<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连接失败</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

        --background: #f9fafb;
        --foreground: #0f1115;
        --primary: #0f1115;
        --primary-foreground: #ffffff;
        --secondary: #ffffff;
        --secondary-foreground: #0f1115;
        --muted: #eceef1;
        --muted-foreground: #61666b;
        --accent: #eceef1;
        --accent-foreground: #0f1115;
        --destructive: #d92d20;
        --destructive-foreground: #ffffff;
        --card: #ffffff;
        --card-foreground: #0f1115;
        --popover: #ffffff;
        --popover-foreground: #0f1115;
        --border: #dde0e3;
        --input: #ffffff;
        --ring: #0f1115;
        --chart-1: #4d6bfe;
        --chart-2: #b54708;
        --chart-3: #12a150;
        --chart-4: #98a2b3;
        --chart-5: #5b6b8c;

        --font-sans: "Noto Sans SC", sans-serif;
        --font-heading: "Noto Sans SC", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      style="
        background: #0b0c0e;
        color: #f2f3f5;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      "
      class="mx-auto flex h-[874px] w-[402px] flex-col overflow-hidden"
    >
      <div class="h-[59px] shrink-0"></div>
      <header class="flex h-11 shrink-0 items-center justify-center">
        <span style="color: #9a9fa6" class="text-[14px] font-medium">DeepSeek · 远程控制</span>
      </header>
      <main class="min-h-0 flex-1 overflow-y-auto px-6">
        <div class="flex min-h-full flex-col justify-center pb-8 pt-6">
          <div
            style="background: #17181b; border-color: #2a2c30"
            class="flex size-16 items-center justify-center rounded-[18px] border"
          >
            <svg
              fill="none"
              width="30"
              height="30"
              stroke="#9a9fa6"
              viewBox="0 0 24 24"
              aria-hidden
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" rx="2" width="18" height="12" />
              <path d="M8 20h8M12 16v4" />
              <path d="M3 3l18 18" stroke="#f2f3f5" />
            </svg>
          </div>
          <h1
            style="color: #f2f3f5"
            class="font-heading mt-6 text-[24px] font-semibold leading-[30px] tracking-[-0.2px]"
          >
            暂时无法连接电脑
          </h1>
          <p style="color: #9a9fa6" class="mt-3 text-[15px] leading-[22px]">
            请确认电脑上的 DSH 正在运行，并已开启远程控制。
          </p>
          <p
            style="color: #7d828a"
            class="mt-4 flex items-center gap-1.5 text-[13px] leading-[18px]"
          >
            <iconify-icon icon="ph:warning-circle" width="16" height="16"></iconify-icon>HTTP 502 ·
            Bad Gateway
          </p>
          <div
            style="background: #121316; border-color: #2a2c30"
            class="mt-8 flex gap-3 rounded-[14px] border p-4"
          >
            <iconify-icon
              icon="ph:info"
              style="color: #7d828a"
              width="18"
              height="18"
              class="mt-px shrink-0"
            ></iconify-icon>
            <p style="color: #9a9fa6" class="text-[13px] leading-[20px]">
              需要重新配对时，请扫码或粘贴电脑端提供的新链接。新配对会替换电脑端之前授权的手机浏览器或
              App，旧配对随即失效。
            </p>
          </div>
        </div>
      </main>
      <footer class="shrink-0 px-6 pb-[34px] pt-4">
        <button
          style="background: #0a84ff"
          class="flex h-[52px] w-full items-center justify-center rounded-[14px] text-[17px] font-semibold text-white"
        >
          重试
        </button>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <button
            style="background: #17181b; border-color: #2a2c30; color: #f2f3f5"
            class="flex h-12 items-center justify-center gap-1.5 rounded-[14px] border text-[15px] font-medium"
          >
            <iconify-icon icon="ph:qr-code" width="18" height="18"></iconify-icon>扫码配对</button
          ><button
            style="background: #17181b; border-color: #2a2c30; color: #f2f3f5"
            class="flex h-12 items-center justify-center gap-1.5 rounded-[14px] border text-[15px] font-medium"
          >
            <iconify-icon icon="ph:link-simple" width="18" height="18"></iconify-icon>粘贴链接
          </button>
        </div>
      </footer>
    </div>
  </body>
</html>
